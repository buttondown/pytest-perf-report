[project]
name = "pytest-perf-report"
version = "0.3.0"
description = "An opinionated, self-contained performance report for your pytest suite: time, CPU, database, HTTP, sleeps, files, and a prioritized TODO list."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Buttondown", email = "support@buttondown.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/buttondown/pytest-perf-report"

[project.entry-points.pytest11]
perf_report = "pytest_perf_report.plugin"

[dependency-groups]
dev = [
    "django>=4.2",
    "pytest-rerunfailures>=14",
    "pytest-xdist>=3.0",
    "ruff>=0.13",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_perf_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
lint.ignore = ["E501"]
lint.select = ["F", "E", "W", "I001", "UP"]
target-version = "py310"
